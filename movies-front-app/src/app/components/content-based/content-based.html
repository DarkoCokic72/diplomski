<div class="flex flex-col items-center justify-center  bg-gray-100 p-4 font-sans antialiased">
    <mat-card class="w-full max-w-5xl  shadow-xl overflow-hidden flex flex-col h-[75vh]">
        <mat-card-content class="flex-grow overflow-y-auto p-4 space-y-4 bg-gray-50">
            @for(message of messages; track message){
            <div class="flex flex-col w-full">
                <!-- Container for the message bubble -->
                <div class="rounded-2xl p-3 max-w-[85%] sm:max-w-[75%]"
                    [class]="isUserMessage(message) ? 'bg-indigo-500 text-white self-end' : 'bg-gray-300 text-gray-800 self-start'">
                    <div>{{ message.content }}</div>
                </div>
            </div>
            }
        </mat-card-content>
    </mat-card>

</div>
